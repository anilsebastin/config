server:
  port: 8072

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: "http://localhost:8070/eureka/"

spring:
  cloud:
    gateway:
      routes:
        - id: accounts-service
          uri: lb://ACCOUNTS
          predicates:
            - Path=/eazybank/accounts/**
        - id: loans-service
          uri: lb://LOANS
          predicates:
            - Path=/eazybank/loans/**
        - id: cards-service
          uri: lb://CARDS
          predicates:
            - Path=/eazybank/cards/**
